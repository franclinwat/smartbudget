# ?? Nom de l'application ??
spring.application.name=smartbudget

# ?? Base de données MySQL (XAMPP) ??
spring.datasource.url=jdbc:mysql://localhost:3306/smartbudget_db?createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ?? JPA / Hibernate ??
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ?? Log4j2 ??
logging.config=classpath:log4j2.xml

# ?? JWT (on reviendra dessus en Phase 6) ??
jwt.secret=smartbudget-secret-key-very-long-256-bits-minimum-required
jwt.expiration=86400000
