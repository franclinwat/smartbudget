spring.application.name=bowency-site
server.port=8080

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Theme actif au premier demarrage (nocturne | grandsoir)
bowency.theme.default=nocturne
bowency.theme.storage=data/active-theme

# Mot de passe administrateur — A CHANGER en production :
# lancer avec BOWENCY_ADMIN_PASSWORD=... ou --bowency.admin.password=...
bowency.admin.password=${BOWENCY_ADMIN_PASSWORD:bowency2026}
spring.messages.fallback-to-system-locale=false
