spring.application.name=bowency-site
server.port=8080

spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Session par cookie uniquement (pas de ;jsessionid dans les URLs)
server.servlet.session.tracking-modes=cookie

# Theme actif au premier demarrage (nocturne | grandsoir | ocre | emeraude | amethyste)
bowency.theme.default=nocturne
bowency.theme.storage=data/active-theme

# Version d'affichage au premier demarrage (immersif | minimal | bento)
bowency.layout.default=immersif
bowency.layout.storage=data/active-layout

# Messages du formulaire de contact (un fichier par message, visibles sur /admin)
bowency.contact.storage=data/contact-messages

# Mot de passe administrateur — A CHANGER en production :
# lancer avec BOWENCY_ADMIN_PASSWORD=... ou --bowency.admin.password=...
bowency.admin.password=${BOWENCY_ADMIN_PASSWORD:bowency2026}
spring.messages.fallback-to-system-locale=false
