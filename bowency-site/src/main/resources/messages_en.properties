real.eyebrow=Our assets & highlights
real.title=The field, in action.
real.1.year=2018 — Cameroon
real.1.title=Tour de l'Espoir
real.1.text=Created by Bowency in 2018, the race entered the UCI Nations' Cup Espoirs calendar from its launch — a first in cycling history for an African event, championing the continent's young talents.
real.2.year=2018 — West Africa
real.2.title=Jab & Vibes
real.2.text=Wholly owned by Bowency, Jab & Vibes marked the 2018 return of international boxing to West Africa: a novel concept blending 6 professional bouts with concerts by renowned artists (Wally Seck, Sidiki Diabaté).
real.3.year=2024 — Côte d'Ivoire
real.3.title=AFCON 2023
real.3.text=Organising committee structuring, steering, training of Ivorian teams and legacy strategy for the Africa Cup of Nations.
real.4.year=2024 — Ghana
real.4.title=African Games, Accra
real.4.text=Alongside the 13th edition of the African Games, with the continent at the centre of the game.

