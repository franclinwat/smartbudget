# ===== Footprint =====
implant.eyebrow=Footprint
implant.title=Pan-African roots, international reach.
implant.text=Based in Paris, Bowency operates across three continents and throughout Africa — Côte d'Ivoire, Cameroon, Senegal, DR Congo, Ghana — close to institutions, federations and territories.

