# ===== Implantation =====
implant.eyebrow=Implantation
implant.title=Un ancrage panafricain, un rayonnement international.
implant.text=Basée à Paris, Bowency intervient sur trois continents et sur l'ensemble du continent africain — Côte d'Ivoire, Cameroun, Sénégal, RD Congo, Ghana — au plus près des institutions, des fédérations et des territoires.

