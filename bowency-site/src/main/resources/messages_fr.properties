vision.eyebrow=Notre vision
vision.title=Réinventer l'expérience du sport et du divertissement — par des projets durables, inclusifs et porteurs de sens.
vision.text=Bowency est une entreprise internationale fondée en 2015, spécialisée dans le conseil stratégique et les services premium dans le sport et l'entertainment. Du concept à la livraison, nous agissons comme agence intégrée ou AMO — vision 360°, maîtrise opérationnelle et créativité stratégique — pour connecter les écosystèmes locaux aux standards internationaux.

