real.eyebrow=Nos assets & temps forts
real.title=Le terrain, en action.
real.1.year=2018 — Cameroun
real.1.title=Tour de l'Espoir
real.1.text=Créée par Bowency en 2018, la course intègre dès son lancement le calendrier de la Coupe des Nations Espoirs du circuit UCI — une première dans l'histoire du cyclisme pour une épreuve africaine, au service des jeunes talents du continent.
real.2.year=2018 — Afrique de l'Ouest
real.2.title=Jab & Vibes
real.2.text=Propriété exclusive de Bowency, Jab & Vibes signait en 2018 le retour de la boxe internationale en Afrique de l'Ouest : un concept inédit mêlant 6 combats professionnels et concerts d'artistes de renom (Wally Seck, Sidiki Diabaté).
real.3.year=2024 — Côte d'Ivoire
real.3.title=CAN 2023
real.3.text=Structuration du comité d'organisation, pilotage, formation des équipes ivoiriennes et stratégie héritage de la Coupe d'Afrique des Nations.
real.4.year=2024 — Ghana
real.4.title=Jeux Africains d'Accra
real.4.text=Aux côtés de la 13ᵉ édition des Jeux Africains, le continent au centre du jeu.

